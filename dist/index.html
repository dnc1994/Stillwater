<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>止水 Stillwater</title>
<meta name="description" content="Be a duck. Drift through one slow day on a river in Jiangnan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3261c'/%3E%3Cpath d='M7 20q8 7 17-1v-5q-2-6-6-2v5z' fill='%23f6f1e4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body class="title">
<main id="game" aria-label="Stillwater"></main>
<div id="veil"></div>

<section id="titleCard">
  <div class="name"><h1>止水</h1><span class="seal">鸭</span></div>
  <p class="latin">STILLWATER</p>
  <p class="tagline" data-t="tagline"></p>
  <button id="start" disabled data-t="loading"></button>
</section>

<header id="hud">
  <div class="cam"><i class="rec"></i><span id="camLabel"></span><span id="clock">06:18</span><span id="phase"></span></div>
  <div class="right">
    <span id="bag"></span>
    <div id="pips" aria-label="ducklings"></div>
    <button id="bJournal" data-t="journal"></button>
    <button id="bTime" data-t="time"></button>
    <button id="bSound"></button>
    <button id="bMusic"></button>
    <button id="bHelp" data-t="help"></button>
    <button id="bLang" data-t="lang"></button>
  </div>
</header>

<ul id="keys"></ul>
<div id="toast" role="status"><b></b><span></span></div>
<div id="breath"><i></i></div>

<aside id="journal" hidden>
  <button class="close" aria-label="Close">×</button>
  <h2 data-t="journal"></h2>
  <p id="journalSub"></p>
  <p id="tally"></p>
  <h3 id="stampsHead"></h3>
  <ul id="stamps"></ul>
  <h3 id="curiosHead"></h3>
  <ul id="curios"></ul>
  <h3 data-t="journal"></h3>
  <ol id="entries"></ol>
</aside>

<figure id="photo" hidden><img alt=""><figcaption><span data-t="photo"></span><a download="stillwater.jpg" data-t="save"></a></figcaption></figure>

<div id="touch">
  <div id="stick"><i></i></div>
  <div class="pad">
    <button data-hold="flap"></button><button data-act="drift"></button>
    <button data-act="dive"></button><button data-act="quack" class="big"></button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
